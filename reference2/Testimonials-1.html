<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Testimonials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Semi+Condensed:wght@600;700;800&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Only three colors, taken from the brand: indigo, red, white */
  :root {
    --blue: #0C013D;
    --red: #C80001;
    --white: #FFFFFF;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --cond: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --sans: "Barlow", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; border-radius: 0 !important; }
  body { margin: 0; background: var(--blue); color: var(--white); font-family: var(--sans); }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }

  .page { max-width: 1240px; margin: 0 auto; padding: clamp(18px, 4vw, 56px) clamp(14px, 4vw, 40px) 64px; }

  /* ---------- header ---------- */
  .top { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding-bottom: 28px; border-bottom: 1px dashed var(--white); position: relative; }
  .top::after { content: ""; position: absolute; left: 0; bottom: -4px; width: 96px; height: 7px; background: var(--red); }
  .eyebrow { display: flex; align-items: center; gap: 14px; margin: 0 0 14px; font-weight: 700; font-size: 14px; letter-spacing: .3em; text-transform: uppercase; }
  .eyebrow::before { content: ""; width: 40px; height: 2px; background: var(--white); }
  h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: clamp(38px, 6.4vw, 84px); line-height: 1.02; letter-spacing: -.015em; color: var(--red); max-width: 16ch; }

  .nav { display: flex; align-items: stretch; border: 2px solid var(--white); }
  .counter { display: grid; place-items: center; padding: 0 18px; min-width: 96px; font-family: var(--cond); font-weight: 800; font-size: 28px; letter-spacing: .06em; font-variant-numeric: tabular-nums; border-right: 2px solid var(--white); }
  .counter small { font-size: 16px; font-weight: 600; }
  .counter em { font-style: normal; color: var(--white); }
  .arrow { width: 64px; height: 64px; display: grid; place-items: center; background: var(--blue); color: var(--white); transition: background .2s, transform .15s; }
  .arrow + .arrow { border-left: 2px solid var(--white); }
  .arrow:hover { background: var(--red); }
  .arrow:active { transform: scale(.92); }
  .arrow svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: square; }

  /* ---------- stage ---------- */
  .stage { position: relative; margin-top: 40px; display: grid; grid-template-columns: minmax(280px, 5fr) 7fr; border: 2px solid var(--white); overflow: hidden; touch-action: pan-y; }
  .photo-cell { background: var(--red); padding: clamp(28px, 5vw, 64px); display: grid; place-items: center; position: relative; overflow: hidden; }
  .photo-cell::after { content: attr(data-n); position: absolute; left: 12px; bottom: -16px; font-family: var(--cond); font-weight: 800; font-size: clamp(100px, 15vw, 200px); line-height: 1; color: var(--blue); pointer-events: none; letter-spacing: -.02em; z-index: 0; }
  .frame { position: relative; z-index: 1; width: min(100%, 300px); aspect-ratio: 5 / 7; background: var(--blue); border: 5px solid var(--white); box-shadow: 16px 16px 0 var(--blue); transition: box-shadow .3s, transform .3s; }
  .stage:hover .frame { transform: translate(-6px, -6px); box-shadow: 22px 22px 0 var(--blue); }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .frame .ini { width: 100%; height: 100%; display: grid; place-items: center; font-family: var(--cond); font-weight: 800; font-size: clamp(64px, 10vw, 120px); color: var(--white); background: var(--blue); }

  .text-cell { background: var(--white); color: var(--blue); padding: clamp(28px, 5vw, 64px); display: flex; flex-direction: column; justify-content: center; gap: 26px; min-width: 0; }
  .mark { font-family: var(--serif); font-weight: 700; font-size: 150px; line-height: .6; height: 68px; color: var(--red); }
  .quote { margin: 0; font-family: var(--serif); font-weight: 500; font-size: clamp(21px, 2.7vw, 35px); line-height: 1.38; color: var(--blue); }
  .who { border-top: 1px dashed var(--blue); padding-top: 22px; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
  .name { margin: 0; font-family: var(--cond); font-weight: 800; font-size: clamp(32px, 4.4vw, 54px); line-height: 1; letter-spacing: -.01em; color: var(--blue); }
  .role { background: var(--blue); color: var(--white); padding: 7px 14px; font-weight: 700; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; }

  /* swap + red wipe */
  .text-cell > *, .photo-cell .frame { transition: opacity .25s; }
  .stage.swap .text-cell > *, .stage.swap .photo-cell .frame { opacity: 0; }
  .wipe { position: absolute; inset: 0; background: var(--red); transform: translateX(-101%); pointer-events: none; z-index: 5; }
  .stage.wiping .wipe { animation: wipe .7s cubic-bezier(.7,0,.2,1) forwards; }
  .stage.wiping.back .wipe { animation-name: wipeBack; }
  @keyframes wipe { 0% { transform: translateX(-101%); } 50% { transform: translateX(0); } 100% { transform: translateX(101%); } }
  @keyframes wipeBack { 0% { transform: translateX(101%); } 50% { transform: translateX(0); } 100% { transform: translateX(-101%); } }

  /* ---------- tabs ---------- */
  .tabs { display: grid; grid-template-columns: repeat(6, 1fr); margin-top: 24px; border: 1px dashed var(--white); }
  .tab { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 12px; background: var(--blue); color: var(--white); text-align: left; transition: background .2s, color .2s; overflow: hidden; min-width: 0; }
  .tab + .tab { border-left: 1px dashed var(--white); }
  .tab:hover { background: var(--red); }
  .tab.on { background: var(--white); color: var(--blue); }
  .tab.on:hover { background: var(--white); }
  .tab .th { width: 44px; height: 44px; flex: none; background: var(--red); color: var(--white); display: grid; place-items: center; font-family: var(--cond); font-weight: 800; font-size: 18px; overflow: hidden; border: 2px solid var(--white); }
  .tab.on .th { border-color: var(--blue); }
  .tab .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tab .nm { font-family: var(--cond); font-weight: 700; font-size: 18px; line-height: 1.1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tab .bar { position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: var(--red); }

  @media (max-width: 860px) {
    .top { grid-template-columns: 1fr; }
    .nav { justify-self: start; }
    .stage { grid-template-columns: 1fr; }
    .tabs { grid-template-columns: repeat(3, 1fr); }
    .tab:nth-child(n+4) { border-top: 1px dashed var(--white); }
    .tab:nth-child(4) { border-left: 0; }
    .frame { width: min(100%, 240px); }
  }
  @media (max-width: 480px) {
    .tab { flex-direction: column; align-items: flex-start; }
    .arrow { width: 54px; height: 54px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>

  function tick(t) {
    const dt = t - last; last = t;
    if (!paused && !busy && !reduce) {
      elapsed += dt;
      tabs[i].querySelector(".bar").style.width = Math.min(100, elapsed / DUR * 100) + "%";
      if (elapsed >= DUR) next();
    }
    requestAnimationFrame(tick);
  }

  paint();
  requestAnimationFrame(tick);
</script>
</body>
</html>
