<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Machine assembly on scroll</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{margin:0;background:#fff;color:#1b2430;font-family:"Helvetica Neue",Arial,sans-serif;}
.track{height:420vh;position:relative;}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.rig{position:relative;width:min(70vw,calc(70vh * 1200 / 896));aspect-ratio:1200/896;}
.rig canvas{position:absolute;inset:0;width:100%;height:100%;will-change:transform;}
.hud{position:absolute;left:24px;right:24px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;font-size:14px;}
.hud .title{font-size:20px;font-weight:600;letter-spacing:-.01em}
.hud .sub{color:#5a6573;margin-top:2px}
.bar{width:140px;height:3px;background:#dfe4ea;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#1b2430}
.state{text-align:right;color:#5a6573}
.tag{position:absolute;font-size:12px;color:#1b2430;background:#fff;border:1px solid #1b2430;padding:2px 7px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
</style>
</head>

    </div>
  </div>
</div>

const W=1200,H=896;
// Regions in priority order (image px). Each layer = its polygon minus all earlier polygons.
// off = exploded offset (image px), at = scroll window [start,end] in 0..1 when it settles.
const parts=[
 {n:'front shaft', poly:[[350,425],[430,415],[505,395],[530,440],[520,500],[480,545],[420,572],[365,560],[350,500]], off:[-170,95], at:[0.00,0.40]},
 {n:'rear shaft',  poly:[[785,240],[840,232],[885,250],[890,300],[870,340],[815,345],[790,300]], off:[170,-95], at:[0.00,0.40]},
 {n:'front cover', poly:[[180,150],[445,95],[445,430],[480,520],[520,640],[600,740],[480,785],[300,700],[190,500]], off:[-105,60], at:[0.10,0.55]},
 {n:'rotor & stator', poly:[[445,215],[520,235],[740,250],[780,215],[810,230],[850,200],[1200,200],[1200,345],[880,345],[940,400],[930,480],[760,560],[640,605],[480,520],[445,430]], off:[55,-80], at:[0.25,0.70]},
 {n:'top housing', poly:[[445,0],[850,0],[850,200],[810,230],[780,215],[740,250],[520,235],[445,215]], off:[0,-185], at:[0.40,0.85]},
 {n:'base frame',  poly:[[0,600],[170,620],[300,650],[440,760],[580,800],[600,745],[740,690],[860,620],[960,520],[1200,420],[1200,896],[0,896]], off:[0,150], at:[0.40,0.85]},
 {n:'lower housing', poly:null, off:[0,60], at:[0.55,1.00]}
];
const rig=document.getElementById('rig');
const img=new Image();
img.onload=()=>{
  const done=[];
  parts.forEach(p=>{
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const g=c.getContext('2d');
    g.beginPath();
    if(p.poly){p.poly.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();}
    else g.rect(0,0,W,H);
    g.clip(); g.drawImage(img,0,0);
    g.restore&&0;
    p.canvas=c; p.ctx=g; rig.appendChild(c);
  });
  // subtract earlier polygons (priority)
  parts.forEach((p,i)=>{
    const g=p.canvas.getContext('2d');
    g.save(); g.globalCompositeOperation='destination-out'; g.fillStyle='#000';
    for(let j=0;j<i;j++){
      const q=parts[j].poly; g.beginPath();
      q.forEach(([x,y],k)=>k?g.lineTo(x,y):g.moveTo(x,y)); g.closePath();
      g.fill(); g.lineWidth=1.5; g.strokeStyle='#000'; g.stroke();
    }
    g.restore();
  });
  update();
};
img.src=SRC;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const track=document.getElementById('track');
const fill=document.getElementById('fill'),pct=document.getElementById('pct'),sub=document.getElementById('sub');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let target=0,cur=0,raf=0;
function progress(){
  const r=track.getBoundingClientRect();
  const max=track.offsetHeight-innerHeight;
  return Math.min(1,Math.max(0,-r.top/max));
}
function update(){
  const p=cur;
  parts.forEach(pt=>{
    if(!pt.canvas)return;
    const [a,b]=pt.at;
    const t=ease(Math.min(1,Math.max(0,(p-a)/(b-a))));
    const k=1-t;
    pt.canvas.style.transform=`translate(${pt.off[0]*k/W*100}%,${pt.off[1]*k/H*100}%)`;
  });
  fill.style.width=(p*100)+'%';
  pct.textContent=p<0.02?'Exploded':p>0.98?'Assembled':'Assembling';
  sub.textContent=p>0.98?'Scroll up to pull it apart':'Scroll down to assemble';
}
function tick(){
  cur+=(target-cur)*(reduce?1:0.12);
  if(Math.abs(target-cur)<0.0005)cur=target;
  update();
  raf=cur!==target?requestAnimationFrame(tick):0;
}
function onScroll(){target=progress();if(!raf)raf=requestAnimationFrame(tick);}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',onScroll);
onScroll();
</script>
